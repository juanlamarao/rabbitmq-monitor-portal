apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-monitor-frontend
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rabbitmq-monitor-frontend
  template:
    metadata:
      labels:
        app: rabbitmq-monitor-frontend
    spec:
      containers:
      - name: frontend
        image: ImageName1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
