metadata:
  name: rabbitmq-monitor-frontend
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rabbitmq-monitor-frontend
  minReplicas: 1
  maxReplicas: 2
