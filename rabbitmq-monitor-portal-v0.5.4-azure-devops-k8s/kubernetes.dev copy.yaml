apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-monitor-api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: rabbitmq-monitor-api}
  template:
    metadata:
      labels: {app: rabbitmq-monitor-api}
    spec:
      initContainers:
      - name: wait-mysql-schema
        image: __BACKEND_IMAGE__
        imagePullPolicy: Always
        command: ["python", "-m", "app.core.wait_for_db"]
        env:
        - name: APP_NAME
          value: "RabbitMQ Monitor Portal"
        - name: APP_ENV
          value: "development"
        - name: APP_DEBUG
          value: "false"
        - name: AUTO_DB_BOOTSTRAP
          value: "false"
        - name: MYSQL_HOST
          value: "rabbitmq-monitor-mysql"
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: "rabbitmq_monitor_portal"
        - name: MYSQL_USER
          value: "app"
        - name: REDIS_HOST
          value: "rabbitmq-monitor-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: LDAP_HOST
          value: "rabbitmq-monitor-ldap"
        - name: LDAP_PORT
          value: "389"
        - name: LDAP_BIND_DN
          value: "cn=admin,dc=example,dc=local"
        - name: LDAP_SEARCH_BASE
          value: "ou=People,dc=example,dc=local"
        - name: LDAP_USE_SSL
          value: "false"
        - name: DIRECTORY_CACHE_REFRESH_INTERVAL_SECONDS
          value: "86400"
        - name: DISCOVERY_SCHEDULER_INTERVAL_SECONDS
          value: "86400"
        - name: REMOVED_QUEUE_CLEANUP_INTERVAL_SECONDS
          value: "86400"
        - name: REMOVED_QUEUE_RETENTION_DAYS
          value: "60"
        - name: DATADOG_SYNC_INTERVAL_SECONDS
          value: "86400"
        - name: PORTAL_PUBLIC_BASE_URL
          value: "http://__INGRESS_HOST__"
        - name: CORS_ORIGINS
          value: "http://__INGRESS_HOST__"
        - name: MYSQL_PASSWORD
          value: "__MYSQL_PASSWORD__"
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
      containers:
      - name: api
        image: __BACKEND_IMAGE__
        imagePullPolicy: Always
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
        ports: [{name: http, containerPort: 8000}]
        env:
        - name: APP_NAME
          value: "RabbitMQ Monitor Portal"
        - name: APP_ENV
          value: "development"
        - name: APP_DEBUG
          value: "false"
        - name: AUTO_DB_BOOTSTRAP
          value: "false"
        - name: MYSQL_HOST
          value: "rabbitmq-monitor-mysql"
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: "rabbitmq_monitor_portal"
        - name: MYSQL_USER
          value: "app"
        - name: REDIS_HOST
          value: "rabbitmq-monitor-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: LDAP_HOST
          value: "rabbitmq-monitor-ldap"
        - name: LDAP_PORT
          value: "389"
        - name: LDAP_BIND_DN
          value: "cn=admin,dc=example,dc=local"
        - name: LDAP_SEARCH_BASE
          value: "ou=People,dc=example,dc=local"
        - name: LDAP_USE_SSL
          value: "false"
        - name: DIRECTORY_CACHE_REFRESH_INTERVAL_SECONDS
          value: "86400"
        - name: DISCOVERY_SCHEDULER_INTERVAL_SECONDS
          value: "86400"
        - name: REMOVED_QUEUE_CLEANUP_INTERVAL_SECONDS
          value: "86400"
        - name: REMOVED_QUEUE_RETENTION_DAYS
          value: "60"
        - name: DATADOG_SYNC_INTERVAL_SECONDS
          value: "86400"
        - name: PORTAL_PUBLIC_BASE_URL
          value: "http://__INGRESS_HOST__"
        - name: CORS_ORIGINS
          value: "http://__INGRESS_HOST__"
        - name: MYSQL_PASSWORD
          value: "__MYSQL_PASSWORD__"
        - name: LDAP_BIND_PASSWORD
          value: "__LDAP_ADMIN_PASSWORD__"
        - name: CREDENTIAL_ENCRYPTION_KEY
          value: "__CREDENTIAL_ENCRYPTION_KEY__"
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 20
        resources:
          requests: {cpu: 150m, memory: 256Mi}
          limits: {cpu: '1', memory: 1Gi}
