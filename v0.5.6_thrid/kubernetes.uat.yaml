# Kubernetes EKS Dev. Variables injected from Azure DevOps Library; no ConfigMap, Secret or Ingress TLS resource.
apiVersion: v1
kind: Namespace
metadata:
  name: __RBTMQ_PORTAL_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rabbitmq-monitor-portal
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-monitor-mysql
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: rabbitmq-monitor-mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-monitor-mysql
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  serviceName: rabbitmq-monitor-mysql
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-monitor-mysql
  template:
    metadata:
      labels:
        app: rabbitmq-monitor-mysql
    spec:
      containers:
      - name: mysql
        image: __RBTMQ_PORTAL_MYSQL_IMAGE__
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_DATABASE
          value: rabbitmq_monitor_portal
        - name: MYSQL_USER
          value: app
        - name: MYSQL_PASSWORD
          value: "__RBTMQ_PORTAL_MYSQL_PASSWORD__"
        - name: MYSQL_ROOT_PASSWORD
          value: "__RBTMQ_PORTAL_MYSQL_ROOT_PASSWORD__"
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
          failureThreshold: 45
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-schema
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: mysql-schema
        emptyDir: {}
      initContainers:
      - name: prepare-schema
        image: __RBTMQ_PORTAL_MYSQL_IMAGE__
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - "cat > '/schema/001_schema.sql' <<'BOOTSTRAP_EOF'\nCREATE DATABASE IF NOT\
          \ EXISTS rabbitmq_monitor_portal\n  CHARACTER SET utf8mb4\n  COLLATE utf8mb4_unicode_ci;\n\
          \nUSE rabbitmq_monitor_portal;\n\nCREATE TABLE IF NOT EXISTS sre_groups\
          \ (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  name VARCHAR(120)\
          \ NOT NULL,\n  description TEXT NULL,\n  is_active BOOLEAN NOT NULL DEFAULT\
          \ TRUE,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at\
          \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_sre_groups_name (name)\n) ENGINE=InnoDB\
          \ DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\n\nCREATE TABLE\
          \ IF NOT EXISTS sre_group_members (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
          \  sre_group_id BIGINT UNSIGNED NOT NULL,\n  email VARCHAR(255) NOT NULL,\n\
          \  position INT NOT NULL DEFAULT 0,\n  created_at DATETIME NOT NULL DEFAULT\
          \ CURRENT_TIMESTAMP,\n  PRIMARY KEY (id),\n  UNIQUE KEY uq_sre_group_member_email\
          \ (sre_group_id, email),\n  KEY ix_sre_group_members_sre_group_id (sre_group_id),\n\
          \  CONSTRAINT fk_sre_group_members_group FOREIGN KEY (sre_group_id) REFERENCES\
          \ sre_groups(id) ON DELETE CASCADE\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4\
          \ COLLATE=utf8mb4_unicode_ci;\n\nCREATE TABLE IF NOT EXISTS datadog_orgs\
          \ (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  name VARCHAR(120)\
          \ NOT NULL,\n  api_url VARCHAR(255) NOT NULL DEFAULT 'https://api.datadoghq.com',\n\
          \  org_url VARCHAR(255) NULL,\n  api_key_encrypted TEXT NULL,\n  app_key_encrypted\
          \ TEXT NULL,\n  description TEXT NULL,\n  is_active BOOLEAN NOT NULL DEFAULT\
          \ TRUE,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at\
          \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_datadog_orgs_name (name)\n) ENGINE=InnoDB\
          \ DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\nCREATE TABLE IF\
          \ NOT EXISTS rabbitmq_clusters (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
          \  name VARCHAR(160) NOT NULL,\n  environment VARCHAR(20) NOT NULL,\n  business_line\
          \ TEXT NULL,\n  protocol VARCHAR(10) NOT NULL DEFAULT 'https',\n  dns VARCHAR(255)\
          \ NOT NULL,\n  api_port INT NOT NULL DEFAULT 15672,\n  api_username VARCHAR(180)\
          \ NOT NULL,\n  api_password_encrypted TEXT NOT NULL,\n  sre_group_id BIGINT\
          \ UNSIGNED NULL,\n  datadog_org_id BIGINT UNSIGNED NULL,\n  datadog_integration_type\
          \ VARCHAR(80) NOT NULL DEFAULT 'custom',\n  datadog_cluster_tag_value VARCHAR(255)\
          \ NULL,\n  datadog_cluster_tag_key VARCHAR(120) NOT NULL DEFAULT 'rabbitmq_cluster',\n\
          \  datadog_vhost_tag_key VARCHAR(120) NOT NULL DEFAULT 'vhost',\n  datadog_queue_tag_key\
          \ VARCHAR(120) NOT NULL DEFAULT 'queue',\n  datadog_node_tag_key VARCHAR(120)\
          \ NULL,\n  datadog_metric_messages VARCHAR(255) NOT NULL DEFAULT 'rabbitmq.queue.messages',\n\
          \  datadog_metric_consumers VARCHAR(255) NOT NULL DEFAULT 'rabbitmq.queue.consumers',\n\
          \  monitor_cluster BOOLEAN NOT NULL DEFAULT TRUE,\n  monitor_queues BOOLEAN\
          \ NOT NULL DEFAULT TRUE,\n  monitor_exchanges BOOLEAN NOT NULL DEFAULT FALSE,\n\
          \  monitor_connections BOOLEAN NOT NULL DEFAULT FALSE,\n  monitor_nodes\
          \ BOOLEAN NOT NULL DEFAULT FALSE,\n  monitor_shovels BOOLEAN NOT NULL DEFAULT\
          \ FALSE,\n  is_active BOOLEAN NOT NULL DEFAULT TRUE,\n  last_discovery_at\
          \ DATETIME NULL,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
          \  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_rabbitmq_clusters_name (name),\n \
          \ KEY ix_clusters_sre_group_id (sre_group_id),\n  KEY ix_clusters_datadog_org_id\
          \ (datadog_org_id),\n  CONSTRAINT fk_clusters_sre_group FOREIGN KEY (sre_group_id)\
          \ REFERENCES sre_groups(id) ON DELETE SET NULL,\n  CONSTRAINT fk_clusters_datadog_org\
          \ FOREIGN KEY (datadog_org_id) REFERENCES datadog_orgs(id) ON DELETE SET\
          \ NULL\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\
          \nCREATE TABLE IF NOT EXISTS cluster_temporary_queue_regexes (\n  id BIGINT\
          \ UNSIGNED NOT NULL AUTO_INCREMENT,\n  cluster_id BIGINT UNSIGNED NOT NULL,\n\
          \  pattern VARCHAR(500) NOT NULL DEFAULT '^$',\n  position INT NOT NULL\
          \ DEFAULT 0,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_cluster_temp_regex_position (cluster_id,\
          \ position),\n  KEY ix_cluster_temp_regex_cluster_id (cluster_id),\n  CONSTRAINT\
          \ fk_temp_regex_cluster FOREIGN KEY (cluster_id) REFERENCES rabbitmq_clusters(id)\
          \ ON DELETE CASCADE\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\
          \nCREATE TABLE IF NOT EXISTS rabbitmq_queues (\n  id BIGINT UNSIGNED NOT\
          \ NULL AUTO_INCREMENT,\n  cluster_id BIGINT UNSIGNED NOT NULL,\n  name VARCHAR(255)\
          \ NOT NULL,\n  vhost VARCHAR(255) NOT NULL,\n  type VARCHAR(80) NULL,\n\
          \  durable BOOLEAN NULL,\n  auto_delete BOOLEAN NULL,\n  exclusive BOOLEAN\
          \ NULL,\n  state VARCHAR(80) NULL,\n  api_raw JSON NULL,\n  description\
          \ TEXT NULL,\n  criticality VARCHAR(40) NULL,\n  owner_email VARCHAR(255)\
          \ NULL,\n  journey VARCHAR(255) NULL,\n  service_name VARCHAR(255) NULL,\n\
          \  monitoring_schedule VARCHAR(40) NOT NULL DEFAULT '24x7',\n  monitoring_custom_window\
          \ VARCHAR(255) NULL,\n  dev_emails JSON NULL,\n  is_dead_letter BOOLEAN\
          \ NOT NULL DEFAULT FALSE,\n  monitor_anomaly BOOLEAN NOT NULL DEFAULT TRUE,\n\
          \  monitor_enabled BOOLEAN NOT NULL DEFAULT TRUE,\n  is_temporary BOOLEAN\
          \ NOT NULL DEFAULT FALSE,\n  is_removed BOOLEAN NOT NULL DEFAULT FALSE,\n\
          \  removed_at DATETIME NULL,\n  discovered_at DATETIME NULL,\n  created_at\
          \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME NOT\
          \ NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n  PRIMARY\
          \ KEY (id),\n  UNIQUE KEY uq_queue_cluster_vhost_name (cluster_id, vhost,\
          \ name),\n  KEY ix_queues_cluster_removed (cluster_id, is_removed),\n  KEY\
          \ ix_queues_name (name),\n  KEY ix_queues_vhost (vhost),\n  CONSTRAINT fk_queues_cluster\
          \ FOREIGN KEY (cluster_id) REFERENCES rabbitmq_clusters(id) ON DELETE CASCADE\n\
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\n\
          CREATE TABLE IF NOT EXISTS monitor_templates (\n  id BIGINT UNSIGNED NOT\
          \ NULL AUTO_INCREMENT,\n  code VARCHAR(120) NOT NULL,\n  name VARCHAR(180)\
          \ NOT NULL,\n  description TEXT NULL,\n  component_type VARCHAR(40) NOT\
          \ NULL DEFAULT 'queue',\n  monitor_kind VARCHAR(80) NOT NULL,\n  default_config\
          \ JSON NOT NULL,\n  datadog_monitor_type VARCHAR(80) NULL DEFAULT 'query\
          \ alert',\n  datadog_query_template TEXT NULL,\n  datadog_message_template\
          \ TEXT NULL,\n  datadog_tags_template JSON NULL,\n  datadog_options JSON\
          \ NULL,\n  is_system BOOLEAN NOT NULL DEFAULT TRUE,\n  is_active BOOLEAN\
          \ NOT NULL DEFAULT TRUE,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
          \  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_monitor_templates_code (code),\n \
          \ KEY ix_monitor_templates_component_active (component_type, is_active)\n\
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\n\
          CREATE TABLE IF NOT EXISTS queue_monitor_templates (\n  id BIGINT UNSIGNED\
          \ NOT NULL AUTO_INCREMENT,\n  queue_id BIGINT UNSIGNED NOT NULL,\n  template_id\
          \ BIGINT UNSIGNED NOT NULL,\n  enabled BOOLEAN NOT NULL DEFAULT TRUE,\n\
          \  overrides JSON NULL,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
          \  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
          \  PRIMARY KEY (id),\n  UNIQUE KEY uq_queue_template (queue_id, template_id),\n\
          \  KEY ix_queue_monitor_templates_enabled (enabled),\n  KEY ix_queue_monitor_templates_template_id\
          \ (template_id),\n  CONSTRAINT fk_queue_templates_queue FOREIGN KEY (queue_id)\
          \ REFERENCES rabbitmq_queues(id) ON DELETE CASCADE,\n  CONSTRAINT fk_queue_templates_template\
          \ FOREIGN KEY (template_id) REFERENCES monitor_templates(id) ON DELETE CASCADE\n\
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\n\
          CREATE TABLE IF NOT EXISTS generated_monitors (\n  id BIGINT UNSIGNED NOT\
          \ NULL AUTO_INCREMENT,\n  queue_id BIGINT UNSIGNED NULL,\n  template_id\
          \ BIGINT UNSIGNED NULL,\n  provider VARCHAR(40) NOT NULL DEFAULT 'datadog',\n\
          \  external_id VARCHAR(255) NULL,\n  external_url VARCHAR(500) NULL,\n \
          \ desired_config JSON NULL,\n  last_applied_config JSON NULL,\n  status\
          \ VARCHAR(40) NOT NULL DEFAULT 'planned',\n  error_message TEXT NULL,\n\
          \  is_active BOOLEAN NOT NULL DEFAULT TRUE,\n  datadog_org_id BIGINT UNSIGNED\
          \ NULL,\n  cluster_id BIGINT UNSIGNED NULL,\n  monitor_scope_type VARCHAR(40)\
          \ NOT NULL DEFAULT 'dedicated_queue_template',\n  grouping_key VARCHAR(120)\
          \ NULL,\n  name VARCHAR(500) NULL,\n  query TEXT NULL,\n  message TEXT NULL,\n\
          \  tags_json JSON NULL,\n  options_json JSON NULL,\n  covered_queues_count\
          \ INT NOT NULL DEFAULT 0,\n  sample_queues_json JSON NULL,\n  desired_config_hash\
          \ VARCHAR(80) NULL,\n  applied_config_hash VARCHAR(80) NULL,\n  sync_status\
          \ VARCHAR(40) NOT NULL DEFAULT 'planned',\n  external_monitor_id VARCHAR(255)\
          \ NULL,\n  external_monitor_url VARCHAR(500) NULL,\n  last_planned_at DATETIME\
          \ NULL,\n  last_synced_at DATETIME NULL,\n  last_error TEXT NULL,\n  created_at\
          \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at DATETIME NOT\
          \ NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n  PRIMARY\
          \ KEY (id),\n  KEY ix_generated_monitors_queue_id (queue_id),\n  KEY ix_generated_monitors_template_id\
          \ (template_id),\n  KEY ix_generated_monitors_provider_status (provider,\
          \ status),\n  KEY ix_generated_monitors_provider_grouping (provider, grouping_key),\n\
          \  KEY ix_generated_monitors_org_status (datadog_org_id, sync_status),\n\
          \  KEY ix_generated_monitors_template_status (template_id, sync_status),\n\
          \  KEY ix_generated_monitors_cluster_id (cluster_id),\n  CONSTRAINT fk_generated_monitors_queue\
          \ FOREIGN KEY (queue_id) REFERENCES rabbitmq_queues(id) ON DELETE SET NULL,\n\
          \  CONSTRAINT fk_generated_monitors_template FOREIGN KEY (template_id) REFERENCES\
          \ monitor_templates(id) ON DELETE SET NULL,\n  CONSTRAINT fk_generated_monitors_datadog_org\
          \ FOREIGN KEY (datadog_org_id) REFERENCES datadog_orgs(id) ON DELETE SET\
          \ NULL,\n  CONSTRAINT fk_generated_monitors_cluster FOREIGN KEY (cluster_id)\
          \ REFERENCES rabbitmq_clusters(id) ON DELETE SET NULL\n) ENGINE=InnoDB DEFAULT\
          \ CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\nCREATE TABLE IF NOT EXISTS\
          \ job_history (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n  job_type\
          \ VARCHAR(80) NOT NULL,\n  status VARCHAR(40) NOT NULL DEFAULT 'pending',\n\
          \  cluster_id BIGINT UNSIGNED NULL,\n  summary TEXT NULL,\n  details JSON\
          \ NULL,\n  started_at DATETIME NULL,\n  finished_at DATETIME NULL,\n  created_at\
          \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (id),\n  KEY\
          \ ix_job_history_cluster_id (cluster_id),\n  KEY ix_job_history_status_created\
          \ (status, created_at),\n  CONSTRAINT fk_job_history_cluster FOREIGN KEY\
          \ (cluster_id) REFERENCES rabbitmq_clusters(id) ON DELETE SET NULL\n) ENGINE=InnoDB\
          \ DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\nCREATE TABLE IF\
          \ NOT EXISTS audit_logs (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,\n\
          \  entity_type VARCHAR(80) NOT NULL,\n  entity_id VARCHAR(80) NULL,\n  action\
          \ VARCHAR(80) NOT NULL,\n  actor VARCHAR(120) NOT NULL DEFAULT 'local-admin',\n\
          \  summary TEXT NULL,\n  before_data JSON NULL,\n  after_data JSON NULL,\n\
          \  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY\
          \ (id),\n  KEY ix_audit_logs_entity (entity_type, entity_id),\n  KEY ix_audit_logs_created_at\
          \ (created_at)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\
          \nINSERT INTO sre_groups (name, description, is_active)\nVALUES ('SRE Default',\
          \ 'Grupo SRE inicial para ambiente local.', TRUE)\nON DUPLICATE KEY UPDATE\
          \ description = VALUES(description), is_active = VALUES(is_active);\n\n\
          INSERT INTO datadog_orgs (name, api_url, org_url, description, is_active)\n\
          VALUES ('Datadog Default', 'https://api.datadoghq.com', NULL, 'Org Datadog\
          \ inicial para vincular clusters.', TRUE)\nON DUPLICATE KEY UPDATE api_url\
          \ = VALUES(api_url), org_url = VALUES(org_url), description = VALUES(description),\
          \ is_active = VALUES(is_active);\n\nINSERT INTO monitor_templates (code,\
          \ name, description, component_type, monitor_kind, default_config, datadog_monitor_type,\
          \ datadog_query_template, datadog_message_template, datadog_tags_template,\
          \ datadog_options, is_system, is_active)\nVALUES\n(\n  'queue_messages_above_threshold',\n\
          \  'Fila com quantidade de mensagens acima de threshold',\n  'Alerta quando\
          \ a quantidade de mensagens na fila ultrapassar o threshold configurado.',\n\
          \  'queue',\n  'threshold',\n  JSON_OBJECT('threshold', 5000, 'window',\
          \ '15m', 'business_days_only', false),\n  'query alert',\n  'max(last_{{window}}):max:{{metric_messages}}{\
          \ {{datadog_scope}} } > {{threshold}}',\n  '{{#is_alert}}\\n\U0001F6A8 RabbitMQ\
          \ Queue em alerta\\n\\nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\\
          nQueue: {{queue.name}}\\n\\nDetalhes da fila: {{public_reference_url}}\\\
          n{{/is_alert}}\\n\\n{{#is_recovery}}\\n✅ RabbitMQ Queue recuperada\\n\\\
          nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\\
          n{{/is_recovery}}',\n  JSON_ARRAY('managed_by:rabbitmq-monitor-portal',\
          \ 'component:queue', 'provider:datadog', 'template:{{template_code}}'),\n\
          \  JSON_OBJECT('include_tags', true, 'notify_no_data', false, 'require_full_window',\
          \ false),\n  TRUE,\n  TRUE\n),\n(\n  'queue_dlq_messages_above_threshold',\n\
          \  'Fila DLQ com mensagens acima de threshold',\n  'Alerta para filas DLQ\
          \ quando houver mensagens acima do limite configurado.',\n  'queue',\n \
          \ 'dlq_threshold',\n  JSON_OBJECT('threshold', 0, 'window', '15m', 'business_days_only',\
          \ false),\n  'query alert',\n  'max(last_{{window}}):max:{{metric_messages}}{\
          \ {{datadog_scope}} } > {{threshold}}',\n  '{{#is_alert}}\\n\U0001F6A8 RabbitMQ\
          \ Queue em alerta\\n\\nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\\
          nQueue: {{queue.name}}\\n\\nDetalhes da fila: {{public_reference_url}}\\\
          n{{/is_alert}}\\n\\n{{#is_recovery}}\\n✅ RabbitMQ Queue recuperada\\n\\\
          nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\\
          n{{/is_recovery}}',\n  JSON_ARRAY('managed_by:rabbitmq-monitor-portal',\
          \ 'component:queue', 'provider:datadog', 'template:{{template_code}}'),\n\
          \  JSON_OBJECT('include_tags', true, 'notify_no_data', false, 'require_full_window',\
          \ false),\n  TRUE,\n  TRUE\n),\n(\n  'queue_messages_low_consumers',\n \
          \ 'Fila com mensagens e baixo consumidores',\n  'Alerta quando houver mensagens\
          \ e consumidores abaixo do mínimo configurado.',\n  'queue',\n  'messages_low_consumers',\n\
          \  JSON_OBJECT('messages_threshold', 1, 'consumers_threshold', 0, 'window',\
          \ '15m', 'business_days_only', false),\n  'query alert',\n  NULL,\n  '{{#is_alert}}\\\
          n\U0001F6A8 RabbitMQ Queue em alerta\\n\\nCluster: {{rabbitmq_cluster.name}}\\\
          nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\n\\nDetalhes da fila: {{public_reference_url}}\\\
          n{{/is_alert}}\\n\\n{{#is_recovery}}\\n✅ RabbitMQ Queue recuperada\\n\\\
          nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\\
          n{{/is_recovery}}',\n  JSON_ARRAY('managed_by:rabbitmq-monitor-portal',\
          \ 'component:queue', 'provider:datadog', 'template:{{template_code}}'),\n\
          \  JSON_OBJECT('include_tags', true, 'notify_no_data', false, 'require_full_window',\
          \ false),\n  TRUE,\n  TRUE\n),\n(\n  'queue_growing_messages',\n  'Fila\
          \ com mensagens crescentes',\n  'Alerta quando a quantidade de mensagens\
          \ crescer durante a janela configurada.',\n  'queue',\n  'growing_messages',\n\
          \  JSON_OBJECT('window', '15m', 'business_days_only', false),\n  'query\
          \ alert',\n  'change(avg(last_{{window}}),last_{{window}}):max:{{metric_messages}}{\
          \ {{datadog_scope}} } > 0',\n  '{{#is_alert}}\\n\U0001F6A8 RabbitMQ Queue\
          \ em alerta\\n\\nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\\
          nQueue: {{queue.name}}\\n\\nDetalhes da fila: {{public_reference_url}}\\\
          n{{/is_alert}}\\n\\n{{#is_recovery}}\\n✅ RabbitMQ Queue recuperada\\n\\\
          nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\\
          n{{/is_recovery}}',\n  JSON_ARRAY('managed_by:rabbitmq-monitor-portal',\
          \ 'component:queue', 'provider:datadog', 'template:{{template_code}}'),\n\
          \  JSON_OBJECT('include_tags', true, 'notify_no_data', false, 'require_full_window',\
          \ false),\n  TRUE,\n  TRUE\n),\n(\n  'queue_without_messages',\n  'Fila\
          \ sem mensagens',\n  'Alerta quando a fila permanecer sem mensagens durante\
          \ a janela configurada.',\n  'queue',\n  'without_messages',\n  JSON_OBJECT('window',\
          \ '15m', 'business_days_only', false),\n  'query alert',\n  'max(last_{{window}}):max:{{metric_messages}}{\
          \ {{datadog_scope}} } < 1',\n  '{{#is_alert}}\\n\U0001F6A8 RabbitMQ Queue\
          \ em alerta\\n\\nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\\
          nQueue: {{queue.name}}\\n\\nDetalhes da fila: {{public_reference_url}}\\\
          n{{/is_alert}}\\n\\n{{#is_recovery}}\\n✅ RabbitMQ Queue recuperada\\n\\\
          nCluster: {{rabbitmq_cluster.name}}\\nVhost: {{vhost.name}}\\nQueue: {{queue.name}}\\\
          n{{/is_recovery}}',\n  JSON_ARRAY('managed_by:rabbitmq-monitor-portal',\
          \ 'component:queue', 'provider:datadog', 'template:{{template_code}}'),\n\
          \  JSON_OBJECT('include_tags', true, 'notify_no_data', false, 'require_full_window',\
          \ false),\n  TRUE,\n  TRUE\n)\nON DUPLICATE KEY UPDATE\n  name = VALUES(name),\n\
          \  description = VALUES(description),\n  component_type = VALUES(component_type),\n\
          \  monitor_kind = VALUES(monitor_kind),\n  default_config = VALUES(default_config),\n\
          \  datadog_monitor_type = COALESCE(datadog_monitor_type, VALUES(datadog_monitor_type)),\n\
          \  datadog_query_template = COALESCE(datadog_query_template, VALUES(datadog_query_template)),\n\
          \  datadog_message_template = COALESCE(datadog_message_template, VALUES(datadog_message_template)),\n\
          \  datadog_tags_template = COALESCE(datadog_tags_template, VALUES(datadog_tags_template)),\n\
          \  datadog_options = COALESCE(datadog_options, VALUES(datadog_options)),\n\
          \  is_system = VALUES(is_system),\n  is_active = VALUES(is_active);\n--\
          \ Apply manually to existing MySQL database. DO NOT DROP existing tables\
          \ / PVC.\nUSE rabbitmq_monitor_portal;\n\nCREATE TABLE IF NOT EXISTS portal_users\
          \ (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  tenant_id\
          \ VARCHAR(64) NOT NULL,\n  object_id VARCHAR(64) NOT NULL,\n  display_name\
          \ VARCHAR(255) NOT NULL,\n  email VARCHAR(255) NOT NULL,\n  last_login_at\
          \ DATETIME NULL,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
          \  UNIQUE KEY uq_portal_users_entra_identity (tenant_id,object_id)\n) ENGINE=InnoDB\
          \ DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE IF NOT EXISTS entra_access_groups\
          \ (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  object_id\
          \ VARCHAR(64) NOT NULL,\n  name VARCHAR(255) NOT NULL,\n  description TEXT\
          \ NULL,\n  is_admin BOOLEAN NOT NULL DEFAULT FALSE,\n  is_active BOOLEAN\
          \ NOT NULL DEFAULT TRUE,\n  UNIQUE KEY uq_entra_access_groups_object_id\
          \ (object_id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE\
          \ IF NOT EXISTS entra_group_clusters (\n  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT\
          \ PRIMARY KEY,\n  group_id BIGINT UNSIGNED NOT NULL,\n  cluster_id BIGINT\
          \ UNSIGNED NOT NULL,\n  UNIQUE KEY uq_entra_group_cluster (group_id,cluster_id),\n\
          \  CONSTRAINT fk_access_group FOREIGN KEY (group_id) REFERENCES entra_access_groups(id)\
          \ ON DELETE CASCADE,\n  CONSTRAINT fk_access_cluster FOREIGN KEY (cluster_id)\
          \ REFERENCES rabbitmq_clusters(id) ON DELETE CASCADE\n) ENGINE=InnoDB DEFAULT\
          \ CHARSET=utf8mb4;\n\nBOOTSTRAP_EOF\n"
        volumeMounts:
        - name: mysql-schema
          mountPath: /schema
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
