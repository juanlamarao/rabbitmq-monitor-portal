apiVersion: batch/v1
kind: CronJob
metadata:
  name: rabbitmq-monitor-directory-refresh
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  schedule: 0 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: directory-refresh
            image: ImageName2
            imagePullPolicy: Always
            command:
            - python
            - -c
            - from app.services.directory_service import refresh_directory_cache;
              print(refresh_directory_cache())
            env:
            - name: REDIS_HOST
              value: rabbitmq-monitor-redis
            - name: REDIS_PORT
