apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-monitor-frontend
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rabbitmq-monitor-frontend
  template:
    metadata:
      labels:
        app: rabbitmq-monitor-frontend
    spec:
      containers:
      - name: frontend
        image: ImageName1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-monitor-frontend
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: rabbitmq-monitor-frontend
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rabbitmq-monitor-frontend
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rabbitmq-monitor-frontend
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-monitor
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  ingressClassName: __RBTMQ_PORTAL_INGRESS_CLASS__
  rules:
  - host: __RBTMQ_PORTAL_INGRESS_HOST__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq-monitor-frontend
            port:
              number: 80
