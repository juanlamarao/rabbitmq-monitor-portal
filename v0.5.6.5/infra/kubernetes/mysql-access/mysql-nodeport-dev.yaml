# Opcional: acesso TCP à instância MySQL existente via IP privado de um nó EKS.
# Aplicar no namespace do portal: kubectl -n <namespace> apply -f mysql-nodeport-dev.yaml
# Não modifica o Service rabbitmq-monitor-mysql, StatefulSet ou PVC existentes.
# Antes, confirmar que 31306 está disponível e é permitido na configuração do cluster.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-monitor-mysql-nodeport
  labels:
    app.kubernetes.io/part-of: rabbitmq-monitor-portal
    app.kubernetes.io/component: mysql-access
spec:
  type: NodePort
  selector:
    app: rabbitmq-monitor-mysql
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
      nodePort: 31306
