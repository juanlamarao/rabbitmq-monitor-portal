              value: "__RBTMQ_PORTAL_LDAP_PORT__"
            - name: LDAP_BIND_DN
              value: "__RBTMQ_PORTAL_LDAP_BIND_DN__"
            - name: LDAP_BIND_PASSWORD
              value: "__RBTMQ_PORTAL_LDAP_BIND_PASSWORD__"
            - name: LDAP_SEARCH_BASE
              value: "__RBTMQ_PORTAL_LDAP_SEARCH_BASE__"
            - name: LDAP_SEARCH_FILTER
              value: (&(objectClass=user)(objectCategory=person))
            - name: LDAP_USE_SSL
              value: "__RBTMQ_PORTAL_LDAP_USE_SSL__"
            - name: LDAP_START_TLS
              value: "__RBTMQ_PORTAL_LDAP_START_TLS__"
            - name: LDAP_TLS_VERIFY
              value: "__RBTMQ_PORTAL_LDAP_TLS_VERIFY__"
            - name: LDAP_REQUIRE_ORG_UNIT
              value: "__RBTMQ_PORTAL_LDAP_REQUIRE_ORG_UNIT__"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 256Mi
  timeZone: America/Sao_Paulo
