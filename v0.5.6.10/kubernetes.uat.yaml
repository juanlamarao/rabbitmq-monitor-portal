# Kubernetes EKS Dev. Variables injected from Azure DevOps Library; no ConfigMap, Secret or Ingress TLS resource.
apiVersion: v1
kind: Namespace
metadata:
  name: __RBTMQ_PORTAL_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: rabbitmq-monitor-portal
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-monitor-mysql
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: rabbitmq-monitor-mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-monitor-mysql
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  serviceName: rabbitmq-monitor-mysql
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-monitor-mysql
  template:
    metadata:
      labels:
        app: rabbitmq-monitor-mysql
    spec:
      containers:
      - name: mysql
        image: __RBTMQ_PORTAL_MYSQL_IMAGE__
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_DATABASE
          value: rabbitmq_monitor_portal
        - name: MYSQL_USER
          value: app
        - name: MYSQL_PASSWORD
          value: "__RBTMQ_PORTAL_MYSQL_PASSWORD__"
        - name: MYSQL_ROOT_PASSWORD
          value: "__RBTMQ_PORTAL_MYSQL_ROOT_PASSWORD__"
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
          failureThreshold: 45
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-schema
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: mysql-schema
        emptyDir: {}
      initContainers:
      - name: prepare-schema
        image: ImageName2
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -ec
        - cp /app/infra/mysql/init/001_schema.sql /schema/001_schema.sql
        volumeMounts:
        - name: mysql-schema
          mountPath: /schema
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-monitor-redis
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: rabbitmq-monitor-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-monitor-redis
  namespace: __RBTMQ_PORTAL_NAMESPACE__
spec:
  serviceName: rabbitmq-monitor-redis
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-monitor-redis
  template:
    metadata:
      labels:
        app: rabbitmq-monitor-redis
    spec:
      containers:
      - name: redis
        image: __RBTMQ_PORTAL_REDIS_IMAGE__
        command:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
